<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player</title>
    <link rel="stylesheet" type="text/css" href="css/style.css"/>
    <link rel="stylesheet" type="text/css" href="css/navigation.css"/>
    <link rel="stylesheet" type="text/css" href="css/player.css"/>
</head>
<body>

<div id="app">
    <section class="screen" id="screen-login" data-screen="login"></section>
    <section class="screen" id="screen-home" data-screen="home"></section>
    <section class="screen" id="screen-livetv" data-screen="livetv"></section>
    <section class="screen" id="screen-movies" data-screen="movies"></section>
    <section class="screen" id="screen-series" data-screen="series"></section>
    <section class="screen" id="screen-favorites" data-screen="favorites"></section>
    <section class="screen" id="screen-config" data-screen="config"></section>

    <div id="loader" class="loader" hidden>
        <div class="spinner"></div>
        <p id="loader-text">Carregando...</p>
    </div>

    <div id="toast" class="toast" hidden></div>

    <div id="dialog" class="dialog-backdrop" hidden>
        <div class="dialog">
            <h3 id="dialog-title">Confirmação</h3>
            <p id="dialog-message"></p>
            <div class="dialog-actions">
                <button type="button" class="btn focusable" id="dialog-cancel">Cancelar</button>
                <button type="button" class="btn btn-primary focusable" id="dialog-confirm">Confirmar</button>
            </div>
        </div>
    </div>
</div>

<div id="player-layer" class="player-layer" hidden>
    <div class="player-surface" id="player-surface"></div>
    <div class="player-ui" id="player-ui">
        <div class="player-top">
            <div class="player-titles">
                <h2 id="player-title"></h2>
                <p id="player-subtitle"></p>
            </div>
            <span class="player-live" id="player-live" hidden>AO VIVO</span>
        </div>

        <div class="player-center">
            <div class="spinner" id="player-spinner" hidden></div>
            <div class="player-error" id="player-error" hidden>
                <h3>Não foi possível reproduzir</h3>
                <p id="player-error-text"></p>
                <div class="player-error-actions">
                    <button type="button" class="player-btn focusable" id="player-retry">Tentar novamente</button>
                    <button type="button" class="player-btn focusable" id="player-close">Voltar</button>
                </div>
            </div>
        </div>

        <div class="player-bottom">
            <div class="player-progress" id="player-progress">
                <div class="player-progress-bar">
                    <div class="player-progress-fill" id="player-progress-fill"></div>
                </div>
                <div class="player-times">
                    <span id="player-time-current">00:00</span>
                    <span id="player-time-total">00:00</span>
                </div>
            </div>
            <div class="player-controls">
                <button type="button" class="player-btn" data-player-action="back">⏹ Voltar</button>
                <button type="button" class="player-btn" data-player-action="rew">⏪ 10s</button>
                <button type="button" class="player-btn player-btn-main" data-player-action="toggle" id="player-toggle">⏸ Pausar</button>
                <button type="button" class="player-btn" data-player-action="ff">10s ⏩</button>
            </div>
        </div>
    </div>
</div>

<script src="js/config.local.js"></script>
<script src="js/services/storage.js"></script>
<script src="js/api/xtream.js"></script>
<script src="js/api/m3uParser.js"></script>
<script src="js/services/epg.js"></script>
<script src="js/player/avplay.js"></script>
<script src="js/app.js"></script>
<script src="js/remote.js"></script>
<script src="js/views/login.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/livetv.js"></script>
<script src="js/views/movies.js"></script>
<script src="js/views/series.js"></script>
<script src="js/views/favorites.js"></script>
<script src="js/views/config.js"></script>
</body>
</html>
